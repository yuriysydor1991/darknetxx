# The network of the ITEST_digits_bash integration test, the same one as of the
# ITEST_digits test (see the ../digits/digits.cfg.in file): a tiny YOLO
# detector of the ten digit glyphs, which the ITEST_digits_bash_training test
# trains from scratch. The glyph fills the whole image, so a single anchor of
# the input size suits every glyph, and the 3x3 output grid of the 24x24 input
# is enough to place it.
#
# The names, the train and the backup paths are relative to the working
# directory of the training, where the ITEST_digits_bash.sh script generates the
# data set, while the detection runs get the names file by the --names
# parameter.

[net]
batch=16
subdivisions=1
width=24
height=24
channels=3
momentum=0.9
decay=0.0005
learning_rate=0.01
burn_in=100
max_batches=400
policy=steps
steps=300,350
scales=.1,.1
# a mirrored glyph is not a digit any more
flip=0
names=digits.names
train=train.txt
backup=backup

[convolutional]
batch_normalize=1
filters=8
size=3
stride=1
pad=1
activation=leaky

[maxpool]
size=2
stride=2

[convolutional]
batch_normalize=1
filters=16
size=3
stride=1
pad=1
activation=leaky

[maxpool]
size=2
stride=2

[convolutional]
batch_normalize=1
filters=32
size=3
stride=1
pad=1
activation=leaky

[maxpool]
size=2
stride=2

[convolutional]
batch_normalize=1
filters=32
size=3
stride=1
pad=1
activation=leaky

# (classes + 5) * num filters of the detections
[convolutional]
size=1
stride=1
pad=1
filters=15
activation=linear

[yolo]
mask=0
anchors=24,24
classes=10
num=1
jitter=0
random=0
