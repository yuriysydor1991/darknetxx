[net]
# Training
batch=64
subdivisions=8
width=32
height=64
channels=1
momentum=0.9
decay=0.0005
angle=0
saturation = 1.5
exposure = 1.5
hue=.1

learning_rate=0.001
burn_in=100
max_batches=550800
policy=steps
steps=448000,449600
scales=.1,.1

track = 1

# Architecture
[convolutional]
filters=8
size=3
stride=1
pad=1
activation=leaky

[maxpool]
size=2
stride=2

[convolutional]
filters=16
size=3
stride=1
pad=1
activation=leaky

[maxpool]
size=2
stride=2

[convolutional]
filters=32
size=3
stride=1
pad=1
activation=leaky

[maxpool]
size=2
stride=2

[convolutional]
filters=64
size=1
stride=1
pad=1
activation=leaky

[maxpool]
size=2
stride=2

# YOLO output layer
[convolutional]
filters=64
size=3
stride=1
pad=1
activation=linear

[yolo]
mask = 0,1,2,3
anchors = 32,64
classes=11
num=1
jitter=.3
ignore_thresh = .7
truth_thresh = 1
random=1.2

